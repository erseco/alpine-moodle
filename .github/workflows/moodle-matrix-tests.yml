name: moodle-matrix

# The 4.1 branch only builds Moodle 4.1 (#189); main's matrix covers 4.5 and
# newer. Each job verifies that Moodle is reachable over HTTP AND that a Moodle-context
# moosh command works (guards against the PR #149 regression). Version tags are
# pinned to the latest available patch releases (there is no bare vX.Y tag); see
# specs/ci-moodle-version-matrix.md.
on:
  push:
    branches:
      - '4.1'
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: moodle-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Moodle 4.1 runs on PHP 8.1 compiled from the patched php-src branch (#189).
  # No SQLite: Moodle 4.1 has no SQLite patch. The PHP compile takes ~15 min.
  moodle41:
    name: "Moodle 4.1.22 · PHP 8.1 · ${{ matrix.backend }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, mariadb]
    env:
      MOODLE_VERSION: v4.1.22
    steps:
      - uses: actions/checkout@v7
      - name: Test Moodle 4.1.22 on compiled PHP 8.1
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          case "$BACKEND" in
            postgres) FILE=docker-compose.test.yml ;;
            *) FILE="docker-compose.test.${BACKEND}.yml" ;;
          esac
          ./tests/compose-test.sh "$FILE"
